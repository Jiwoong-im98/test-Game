[project]
name = "test-game"
version = "0.1.0"
description = "Turn-based pixel-art roguelite dungeon crawler"
requires-python = ">=3.11"
dependencies = [
    "pygame",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["game"]
